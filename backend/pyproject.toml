[project]
name = "system-analyzer-service"
version = "0.1.0"
description = "Linux 远程诊断与启动过程分析平台：后端 API、Worker 与共享领域代码"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.2",
    "asyncpg>=0.29.0",
    "fastapi>=0.115.0",
    "jsonschema>=4.23",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy[asyncio]>=2.0.32",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
sas-api = "system_analyzer.api.server:main"
sas-worker = "system_analyzer.worker.main:main"

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/system_analyzer"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
# 代码注释与文档用中文，全角标点是刻意写法，不做歧义字符检查
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["-m", "not integration", "--strict-markers"]
markers = [
    "integration: 需要真实 PostgreSQL 的集成测试，默认不执行，用 pytest -m integration 单独运行",
]
