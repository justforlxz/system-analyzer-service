name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: 后端静态检查与单元测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest

  backend-integration:
    name: 后端集成测试（PostgreSQL）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sas
          POSTGRES_PASSWORD: sas
          POSTGRES_DB: system_analyzer
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U sas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SAS_DATABASE_URL: postgresql+asyncpg://sas:sas@127.0.0.1:55432/system_analyzer
      SAS_TEST_DATABASE_URL: postgresql+asyncpg://sas:sas@127.0.0.1:55432/system_analyzer
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run alembic upgrade head
      - run: uv run pytest -m integration

  frontend:
    name: 前端静态检查、单元测试与构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run test
      - run: npm run build

  api-client-drift:
    name: OpenAPI 客户端与后端接口一致
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 重新生成 OpenAPI 文档与 TypeScript 类型
        env:
          SAS_DATABASE_URL: postgresql+asyncpg://ci:ci@127.0.0.1:5432/ci
        run: |
          cd backend && uv sync --frozen && uv run python -m system_analyzer.tools.export_openapi
          cd ../frontend && npm ci && npm run api:generate
      - name: 生成结果与仓库中的文件不一致就失败
        run: git diff --exit-code -- frontend/src/lib/api/schema.d.ts
